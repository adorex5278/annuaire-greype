name: Synchroniser l'icône du site officiel

on:
  schedule:
    - cron: "17 5 * * *"   # tous les jours vers 7 h (heure de Paris)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python .github/scripts/sync_favicon.py
      - name: Commit si l'icône a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898208+github-actions[bot]@users.noreply.github.com"
          git add assets/favicon.png assets/apple-touch-icon.png
          git diff --cached --quiet || { git commit -m "Icône synchronisée depuis www.greype-france.com" && git push; }
